<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #ddd;
        }

        .menu-btn.active {
            background: #222;
            color: white;
        }

        .page {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .page.active {
            display: block;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 3px;
        }

        .btn-tambah {
            background: #222;
            color: white;
        }

        table {
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        .form-produk {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .form-produk input,
        .form-produk select,
        #metodePembayaran,
        #uangBayar {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
        }

        .btn-simpan {
            background: #198754;
            color: white;
        }

        .btn-batal {
            background: #dc3545;
            color: white;
        }

        .btn-bayar {
            background: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

    <h1 id="judulHalaman">Kasir</h1>

    <div class="menu">
        <button
            class="menu-btn active"
            onclick="bukaHalaman('kasir', this)"
        >
            Kasir
        </button>

        <button
            class="menu-btn"
            onclick="bukaHalaman('produk', this)"
        >
            Produk
        </button>
    </div>


    <div id="kasir" class="page active">

        <h2>Kasir</h2>

        <button
            class="btn-tambah"
            onclick="tampilkanFormProduk()"
        >
            + Tambah Produk
        </button>

        <h3>Keranjang</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Produk</th>
                    <th>Jumlah</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody id="keranjang">
                <tr>
                    <td colspan="3" class="kosong">
                        Keranjang kosong
                    </td>
                </tr>
            </tbody>
        </table>

        <h3>
            Total:
            <span id="total">Rp 0</span>
        </h3>

        <hr>

        <h3>Pembayaran</h3>

        <select id="metodePembayaran">
            <option value="cash">Cash</option>
            <option value="qris">QRIS</option>
        </select>

        <input
            type="number"
            id="uangBayar"
            placeholder="Uang pembayaran"
        >

        <p>
            Kembalian:
            <span id="kembalian">Rp 0</span>
        </p>

        <button
            class="btn-bayar"
            onclick="prosesPembayaran()"
        >
            Proses Pembayaran
        </button>

    </div>


    <div id="produk" class="page">

        <h2>Produk</h2>

        <button
            class="btn-tambah"
            onclick="tampilkanFormProduk()"
        >
            + Tambah Produk
        </button>

    </div>


    <div
        id="formProduk"
        class="form-produk"
    >

        <h2>Tambah Produk</h2>

        <input
            type="text"
            id="kodeProduk"
            placeholder="Kode Produk"
        >

        <input
            type="text"
            id="barcodeProduk"
            placeholder="Barcode"
        >

        <input
            type="text"
            id="namaProdukBaru"
            placeholder="Nama Produk"
        >

        <input
            type="text"
            id="kategoriProduk"
            placeholder="Kategori"
        >

        <input
            type="number"
            id="hargaBeli"
            placeholder="Harga Beli"
        >

        <input
            type="number"
            id="hargaJual"
            placeholder="Harga Jual"
        >

        <input
            type="number"
            id="stokAwal"
            value="0"
            placeholder="Stok Awal"
        >

        <input
            type="number"
            id="stokMinimum"
            value="5"
            placeholder="Stok Minimum"
        >

        <select id="satuanProduk">
            <option value="PCS">PCS</option>
            <option value="BOX">BOX</option>
            <option value="KG">KG</option>
            <option value="LITER">LITER</option>
        </select>

        <select id="statusProduk">
            <option value="Aktif">Aktif</option>
            <option value="Tidak Aktif">Tidak Aktif</option>
        </select>

        <button
            class="btn-simpan"
            onclick="simpanProduk()"
        >
            Simpan Produk
        </button>

        <button
            class="btn-batal"
            onclick="tutupFormProduk()"
        >
            Batal
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
