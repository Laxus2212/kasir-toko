<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Toko</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-tambah {
            width: 100%;
            background: #2563eb;
            color: white;
        }

        .btn-bayar {
            width: 100%;
            background: #16a34a;
            color: white;
        }

        .btn-hapus {
            background: #dc2626;
            color: white;
            padding: 7px 10px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .total {
            margin-top: 15px;
            padding: 18px;
            background: #111827;
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }

        .kembalian {
            margin-bottom: 15px;
            padding: 15px;
            background: #ecfdf5;
            color: #065f46;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .kosong {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        #kirimForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>KASIR TOKO</h1>
    <p>Sistem Kasir Sederhana</p>
</div>

<div class="container">

    <div class="card">

        <h2>Tambah Produk</h2>

        <label>Nama Produk</label>
        <input
            type="text"
            id="namaProduk"
            placeholder="Contoh: Indomie"
        >

        <label>Harga</label>
        <input
            type="number"
            id="hargaProduk"
            placeholder="Contoh: 3500"
        >

        <label>Jumlah</label>
        <input
            type="number"
            id="jumlahProduk"
            value="1"
            min="1"
        >

        <button
            class="btn-tambah"
            onclick="tambahProduk()"
        >
            + Tambah ke Keranjang
        </button>

    </div>


    <div class="card">

        <h2>Keranjang Belanja</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Produk</th>
                        <th>Harga</th>
                        <th>Jumlah</th>
                        <th>Subtotal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="keranjang">

                    <tr>
                        <td colspan="6" class="kosong">
                            Belum ada produk
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <div class="total">
            <span>TOTAL</span>
            <span id="total">Rp 0</span>
        </div>


        <br>


        <h2>Pembayaran</h2>

        <label>Metode Pembayaran</label>

        <select
            id="metodePembayaran"
            onchange="ubahMetode()"
        >
            <option value="cash">Cash</option>
            <option value="qris">QRIS</option>
        </select>


        <div id="uangBayarBox">

            <label>Uang Dibayar</label>

            <input
                type="number"
                id="uangBayar"
                placeholder="Contoh: 10000"
                oninput="hitungKembalian()"
            >

        </div>


        <div class="kembalian">

            <span>Kembalian</span>

            <span id="kembalian">
                Rp 0
            </span>

        </div>


        <button
            class="btn-bayar"
            onclick="prosesPembayaran()"
        >
            BAYAR
        </button>

    </div>

</div>


<!-- FORM KHUSUS KIRIM KE GOOGLE APPS SCRIPT -->

<form
    id="kirimForm"
    method="POST"
    target="kirimFrame"
    action="https://script.google.com/macros/s/AKfycbxX9XqRImLGvvTosHjLYBS4G4HkZPwTb_XfKxiFNHxs83BSYkbm9XDz28gJ4huMsPML/exec"
>

    <input
        type="hidden"
        name="data"
        id="dataKirim"
    >

</form>


<iframe
    name="kirimFrame"
    id="kirimFrame"
    style="display:none;"
></iframe>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxX9XqRImLGvvTosHjLYBS4G4HkZPwTb_XfKxiFNHxs83BSYkbm9XDz28gJ4huMsPML/exec";


let keranjang = [];


function formatRupiah(angka) {

    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: 0
    }).format(angka);

}


function getTotal() {

    return keranjang.reduce(
        (total, produk) =>
            total + produk.subtotal,
        0
    );

}


function tambahProduk() {

    const nama =
        document.getElementById("namaProduk").value.trim();

    const harga =
        Number(
            document.getElementById("hargaProduk").value
        );

    const jumlah =
        Number(
            document.getElementById("jumlahProduk").value
        );


    if (!nama) {

        alert("Nama produk harus diisi.");
        return;

    }


    if (harga <= 0) {

        alert("Harga produk harus diisi.");
        return;

    }


    if (jumlah <= 0) {

        alert("Jumlah produk harus lebih dari 0.");
        return;

    }


    keranjang.push({

        nama: nama,

        harga: harga,

        jumlah: jumlah,

        subtotal: harga * jumlah

    });


    tampilkanKeranjang();


    document.getElementById("namaProduk").value = "";
    document.getElementById("hargaProduk").value = "";
    document.getElementById("jumlahProduk").value = "1";

}


function tampilkanKeranjang() {

    const tbody =
        document.getElementById("keranjang");

    tbody.innerHTML = "";


    if (keranjang.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="kosong">
                    Belum ada produk
                </td>
            </tr>
        `;

        document.getElementById("total").textContent =
            "Rp 0";

        return;

    }


    keranjang.forEach(
        (produk, index) => {

            tbody.innerHTML += `

                <tr>

                    <td>${index + 1}</td>

                    <td>${produk.nama}</td>

                    <td>
                        ${formatRupiah(produk.harga)}
                    </td>

                    <td>${produk.jumlah}</td>

                    <td>
                        ${formatRupiah(produk.subtotal)}
                    </td>

                    <td>

                        <button
                            class="btn-hapus"
                            onclick="hapusProduk(${index})"
                        >
                            Hapus
                        </button>

                    </td>

                </tr>

            `;

        }
    );


    document.getElementById("total").textContent =
        formatRupiah(getTotal());


    hitungKembalian();

}


function hapusProduk(index) {

    keranjang.splice(index, 1);

    tampilkanKeranjang();

}


function ubahMetode() {

    const metode =
        document.getElementById(
            "metodePembayaran"
        ).value;


    const box =
        document.getElementById(
            "uangBayarBox"
        );


    if (metode === "qris") {

        box.style.display = "none";

        document.getElementById(
            "uangBayar"
        ).value = "";

        document.getElementById(
            "kembalian"
        ).textContent = "Rp 0";

    } else {

        box.style.display = "block";

    }

}


function hitungKembalian() {

    const metode =
        document.getElementById(
            "metodePembayaran"
        ).value;


    if (metode === "qris") {
        return;
    }


    const total = getTotal();


    const uang =
        Number(
            document.getElementById(
                "uangBayar"
            ).value
        );


    let kembali = uang - total;


    if (kembali < 0) {
        kembali = 0;
    }


    document.getElementById(
        "kembalian"
    ).textContent =
        formatRupiah(kembali);

}


/*
 * KIRIM KE GOOGLE SHEETS
 */

function kirimKeGoogleSheets(data) {

    document.getElementById(
        "dataKirim"
    ).value = JSON.stringify(data);


    document.getElementById(
        "kirimForm"
    ).submit();

}


/*
 * PROSES PEMBAYARAN
 */

function prosesPembayaran() {

    if (keranjang.length === 0) {

        alert("Keranjang masih kosong.");

        return;

    }


    const metode =
        document.getElementById(
            "metodePembayaran"
        ).value;


    const total = getTotal();


    let uangBayar = 0;


    if (metode === "cash") {

        uangBayar =
            Number(
                document.getElementById(
                    "uangBayar"
                ).value
            );


        if (uangBayar <= 0) {

            alert(
                "Masukkan uang pembayaran."
            );

            return;

        }


        if (uangBayar < total) {

            alert(
                "Uang pembayaran kurang " +
                formatRupiah(
                    total - uangBayar
                )
            );

            return;

        }

    }


    const sekarang = new Date();


    const idTransaksi =
        "TRX-" +
        sekarang.getTime();


    const tanggal =
        sekarang.toLocaleDateString(
            "id-ID"
        );


    const jam =
        sekarang.toLocaleTimeString(
            "id-ID"
        );


    /*
     * KIRIM SETIAP PRODUK
     */

    keranjang.forEach(
        function(produk) {

            const data = {

                idTransaksi:
                    idTransaksi,

                tanggal:
                    tanggal,

                jam:
                    jam,

                produk:
                    produk.nama,

                jumlah:
                    produk.jumlah,

                total:
                    produk.subtotal,

                metode:
                    metode.toUpperCase()

            };


            kirimKeGoogleSheets(data);

        }
    );


    /*
     * TAMPILKAN SUKSES
     */

    let pesan =
        "PEMBAYARAN BERHASIL!\n\n";


    pesan +=
        "ID Transaksi: " +
        idTransaksi +
        "\n";


    pesan +=
        "Total: " +
        formatRupiah(total) +
        "\n";


    if (metode === "cash") {

        pesan +=
            "Dibayar: " +
            formatRupiah(uangBayar) +
            "\n";


        pesan +=
            "Kembalian: " +
            formatRupiah(
                uangBayar - total
            );

    } else {

        pesan +=
            "Metode: QRIS";

    }


    alert(pesan);


    keranjang = [];


    document.getElementById(
        "uangBayar"
    ).value = "";


    document.getElementById(
        "kembalian"
    ).textContent = "Rp 0";


    tampilkanKeranjang();

}

</script>

</body>
</html>
